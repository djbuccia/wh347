    const blob = new Blob([arr], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "WH347_Payroll_Template.xlsx" });
    a.click(); URL.revokeObjectURL(a.href);
  } catch(e) { alert("Download failed: " + e.message); }
}

async function generatePDF(data) {
  if (!window.jspdf) {
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "pt", format: "letter" });
  const W = 612, H = 792, m = 30;

  const sf = (sz, bold=false) => { doc.setFont("helvetica", bold?"bold":"normal"); doc.setFontSize(sz); };
  const tc = (r,g,b) => doc.setTextColor(r,g,b);
  const tx = (str, x, y, opts={}) => { if(!str) return; doc.text(String(str), x, y, opts); };

  tc(0,0,0);
  sf(9,true); tx("U.S. DEPARTMENT OF LABOR", W/2, H-28, {align:"center"});
  sf(7,true); tx("WAGE AND HOUR DIVISION", W/2, H-38, {align:"center"});
  sf(12,true); tx("PAYROLL", W/2, H-50, {align:"center"});
  sf(6); tx("(For Contractor's Optional Use — See Instructions at www.dol.gov/whd)", W/2, H-60, {align:"center"});
  sf(6); doc.text("Form WH-347 (Rev. 08/2008)", W-m, H-28, {align:"right"});
  doc.text("OMB No. 1235-0008", W-m, H-38, {align:"right"});

  const y1 = H-112, rh = 48;
  doc.rect(m, y1, 240, rh); doc.rect(m+240, y1, 200, rh);
  doc.rect(m+440, y1, 80, rh/2); doc.rect(m+440, y1+rh/2, 80, rh/2);
  sf(5.5); tc(80,80,80);
  tx("NAME AND ADDRESS OF CONTRACTOR", m+2, y1+rh-6);
  tx("PROJECT AND LOCATION", m+242, y1+rh-6);
  tx("PAYROLL NO.", m+442, y1+rh/2-4);
  tx("WEEK ENDING", m+442, y1+rh-4);
  sf(8,true); tc(0,0,0);
  tx((data.contractor_name||"").substring(0,42), m+4, y1+30);
  sf(7); tx((data.contractor_address||"").substring(0,42), m+4, y1+18);
  sf(8,true); tx((data.project_name||"").substring(0,36), m+244, y1+30);
  sf(7); tx((data.project_location||"").substring(0,36), m+244, y1+18);
  sf(8,true); tx(String(data.payroll_number||""), m+444, y1+rh/2-14);
  tx(data.week_ending||"", m+444, y1+rh-14);

  const y2 = y1-22;
  doc.rect(m,y2,240,22); doc.rect(m+240,y2,200,22);
  sf(5.5); tc(80,80,80);
  tx("PROJECT OR CONTRACT NO.", m+2, y2+15); tx("PROJECT OR CONTRACT NO.", m+242, y2+15);
  sf(7); tc(0,0,0);
  tx(data.contract_number||"", m+4, y2+6); tx(data.project_number||"", m+244, y2+6);

  const cw=[20,108,55,22,22,22,22,22,22,22,30,52,34,34];
  const ch=["#","NAME / SS LAST 4","CLASSIFICATION","S","M","T","W","T","F","S","TOT","TOTAL HRS","RATE","GROSS"];
  const y3=y2-34; let xp=m;
  cw.forEach((w,i)=>{
    doc.rect(xp,y3,w,34); sf(5); tc(0,0,0);
    tx(ch[i], xp+w/2, y3+20, {align:"center"}); xp+=w;
  });

  const emps = data.employees||[]; let yE=y3-32;
  emps.slice(0,7).forEach((emp,idx)=>{
    let xr=m; const hrs=emp.daily_hours||[0,0,0,0,0,0,0];
    const tot=hrs.reduce((a,b)=>a+(+b||0),0);
    const rh2=32;
    doc.rect(xr,yE,cw[0],rh2); sf(7,true); tc(0,0,0);
    tx(String(idx+1),xr+cw[0]/2,yE+rh2/2+3,{align:"center"}); xr+=cw[0];
    doc.rect(xr,yE,cw[1],rh2);
    sf(7,true); tx((emp.name||"").substring(0,20),xr+2,yE+22);
    sf(6); tx("***-**-"+(emp.ss_last4||"****"),xr+2,yE+12); xr+=cw[1];
    doc.rect(xr,yE,cw[2],rh2); sf(6);
    doc.splitTextToSize(emp.classification||"",cw[2]-4).slice(0,3).forEach((l,li)=>tx(l,xr+2,yE+22-li*7));
    xr+=cw[2];
    for(let d=0;d<7;d++){
      doc.rect(xr,yE,cw[3+d],rh2);
      if(hrs[d]){sf(7,true);tx(String(hrs[d]),xr+cw[3+d]/2,yE+rh2/2+3,{align:"center"});}
      xr+=cw[3+d];
    }
    doc.rect(xr,yE,cw[10],rh2); sf(7,true); tx(String(tot),xr+cw[10]/2,yE+rh2/2+3,{align:"center"}); xr+=cw[10];
    doc.rect(xr,yE,cw[11],rh2); sf(6);
    tx("ST: "+(emp.st_hours||tot),xr+2,yE+22);
    if(emp.ot_hours) tx("OT: "+emp.ot_hours,xr+2,yE+12); xr+=cw[11];
    doc.rect(xr,yE,cw[12],rh2); sf(6);
    tx("$"+(emp.rate_of_pay||""),xr+2,yE+22);
    if(emp.ot_rate) tx("$"+emp.ot_rate+" OT",xr+2,yE+12); xr+=cw[12];
    doc.rect(xr,yE,cw[13],rh2); sf(7,true);
    tx("$"+(emp.gross_wages||""),xr+2,yE+rh2/2+3);
    yE-=rh2;
  });

  // Deductions
  const dc=[20,108,55,32,32,32,32,32,32,38,38];
  const dl=["#","NAME","CLASS","FICA","FED TAX","STATE","OTHER1","OTHER2","OTHER3","TOTAL DED","NET WAGES"];
  const yd=yE-6; let xd=m;
  dc.forEach((w,i)=>{
    doc.rect(xd,yd-18,w,18); sf(5); tc(0,0,0);
    tx(dl[i],xd+w/2,yd-6,{align:"center"}); xd+=w;
  });
  let yd2=yd-18;
  emps.slice(0,7).forEach((emp,idx)=>{
    const rv=[String(idx+1),(emp.name||"").substring(0,18),(emp.classification||"").substring(0,10),
      emp.fica,emp.fed_tax,emp.state_tax,emp.other_ded1,emp.other_ded2,emp.other_ded3,emp.total_deductions,emp.net_wages];
    let xdr=m;
    dc.forEach((w,i)=>{
      doc.rect(xdr,yd2-14,w,14);
      if(rv[i]){sf(5.5);const p=i>=3?"$":"";tx((p+rv[i]).substring(0,Math.floor(w/3.5)),xdr+w/2,yd2-4,{align:"center"});}
      xdr+=w;
    });
    yd2-=14;
  });

  // Compliance
  const yc=yd2-20; sf(7,true); tc(0,0,0); tx("STATEMENT OF COMPLIANCE",m,yc);
  sf(6);
  const ct=`I, the undersigned, do hereby state that I pay or supervise the payment of persons employed by ${data.contractor_name||"__________"} on the ${data.project_name||"__________"}; that during the payroll period commencing ${data.period_start||"______"} and ending ${data.week_ending||"______"} all persons employed have been paid the full weekly wages earned, that no rebates have been or will be made either directly or indirectly, and that no deductions have been made except as permitted by regulations issued under the Copeland Act (29 CFR Part 3).`;
  let ycl=yc-10;
  doc.splitTextToSize(ct,W-2*m).slice(0,5).forEach(l=>{tx(l,m,ycl);ycl-=8;});

  const ys=ycl-22;
  doc.line(m,ys,m+190,ys); doc.line(m+230,ys,m+430,ys);
  sf(6); tx("Signature",m,ys+8); tx("Title",m+230,ys+8);
  doc.line(m,ys-28,m+190,ys-28); doc.line(m+230,ys-28,m+330,ys-28);
  tx("Name (Please Print)",m,ys-22); tx("Date",m+230,ys-22);
  sf(8,true);
  tx(data.signatory_name||"",m+2,ys-4);
  tx(data.signatory_title||"",m+232,ys-4);
  tx(data.signature_date||"",m+232,ys-32);

  sf(5); tc(120,120,120);
  tx("THE WILLFUL FALSIFICATION OF ANY OF THE ABOVE STATEMENTS MAY SUBJECT THE CONTRACTOR OR SUBCONTRACTOR TO CIVIL OR CRIMINAL PROSECUTION. SEE SECTION 1001 OF TITLE 18 AND SECTION 231 OF TITLE 31 OF THE UNITED STATES CODE.",W/2,16,{align:"center",maxWidth:W-60});

  return doc.output("blob");
}

function App() {
  const [step, setStep] = useState("upload");
  const [editedData, setEditedData] = useState(null);
  const [error, setError] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const [fileName, setFileName] = useState("");
  const [pdfBlob, setPdfBlob] = useState(null);
  const [apiKey, setApiKey] = useState("");
  const [showKey, setShowKey] = useState(false);
  const fileRef = useRef();

  const parseFile = useCallback(async (file) => {
    if (!apiKey.trim()) { setError("Please enter your Anthropic API key above before uploading."); return; }
    setStep("parsing"); setError(""); setFileName(file.name);
    try {
      const isText = /\.(csv|txt|tsv)$/i.test(file.name);
      let messages;
      if (isText) {
        const content = await file.text();
        messages = [{ role:"user", content:`Parse this payroll report and extract WH-347 data:\n\n${content}` }];
      } else {
        const b64 = await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
        const t = file.type==="application/pdf" ? "document" : "image";
        messages = [{role:"user",content:[{type:t,source:{type:"base64",media_type:file.type,data:b64}},{type:"text",text:"Parse this payroll report and extract WH-347 data."}]}];
      }
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,system:PARSE_SYSTEM,messages})
      });
      if (!resp.ok) { const e=await resp.json(); throw new Error(e.error?.message||"API error"); }
      const result = await resp.json();
      const raw = result.content.map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(raw);
      setEditedData(JSON.parse(JSON.stringify(parsed)));
      setStep("review");
    } catch(e) { setError("Error: "+e.message); setStep("upload"); }
  }, [apiKey]);

  const handleGenerate = async () => {
    setStep("parsing");
    try {
      const blob = await generatePDF(editedData);
      setPdfBlob(blob); setStep("done");
    } catch(e) { setError("PDF error: "+e.message); setStep("review"); }
  };

  const handleDownload = () => {
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement("a");
    a.href=url; a.download=`WH347_${(editedData?.week_ending||"form").replace(/\//g,"-")}.pdf`;
    a.click(); URL.revokeObjectURL(url);
  };

  const updateField = (path, value) => {
    setEditedData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const parts = path.split(".");
      let obj = next;
      for (let i=0;i<parts.length-1;i++) {
        const p=parts[i];
        if(p.includes("[")){ const[k,idx]=p.replace("]","").split("["); obj=obj[k][parseInt(idx)]; }
        else obj=obj[p];
      }
      obj[parts[parts.length-1]]=value;
      return next;
    });
  };

  const stepIdx = ["upload","parsing","review","done"].indexOf(step);

  const css = {
    page: {maxWidth:880,margin:"0 auto",padding:"28px 20px"},
    card: {background:"#fff",border:"1px solid #e0e0e0",borderRadius:12,padding:"24px 28px",marginBottom:18,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"},
    btn: {background:"#1B2A4A",color:"#fff",border:"none",borderRadius:8,padding:"11px 24px",fontSize:13,fontWeight:600,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:8,transition:"opacity 0.15s"},
    btnOut: {background:"transparent",color:"#1B2A4A",border:"1px solid #1B2A4A",borderRadius:8,padding:"9px 18px",fontSize:13,fontWeight:500,cursor:"pointer"},
    btnGold: {background:"#C9A84C",color:"#fff",border:"none",borderRadius:8,padding:"11px 24px",fontSize:13,fontWeight:600,cursor:"pointer"},
    inp: {border:"1px solid #ccc",borderRadius:6,padding:"8px 10px",fontSize:13,background:"#fff",color:"#1a1a1a",width:"100%"},
    lbl: {fontSize:11,color:"#666",fontWeight:600,marginBottom:4,display:"block",textTransform:"uppercase",letterSpacing:0.5},
    g2: {display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14},
    g3: {display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12},
    g6: {display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:8,marginBottom:12},
    secTitle: {fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:"#888",marginBottom:14,paddingBottom:8,borderBottom:"1px solid #eee"},
    spinner: {width:34,height:34,border:"3px solid #eee",borderTopColor:"#1B2A4A",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 16px"},
    empCard: {border:"1px solid #e8e8e8",borderRadius:10,padding:"16px 18px",marginBottom:14,background:"#fafafa"},
    badge: {display:"inline-block",fontSize:10,padding:"2px 10px",borderRadius:12,background:"#e8f0fb",color:"#1a56b0",fontWeight:500,marginLeft:8},
    hrsGrid: {display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:10},
    err: {background:"#fdecea",color:"#b71c1c",border:"1px solid #f5c6cb",borderRadius:8,padding:"12px 16px",fontSize:13,marginBottom:16},

  };

  const Field = ({label, path, value}) => (
    <div>
      <label style={css.lbl}>{label}</label>
      <input style={css.inp} value={value||""} onChange={e=>updateField(path,e.target.value)}/>

  );

  return (
    <div style={css.page}>
      {/* Header */}
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{display:"inline-block",background:"#1B2A4A",color:"#C9A84C",fontSize:10,fontWeight:700,letterSpacing:3,padding:"4px 14px",borderRadius:20,textTransform:"uppercase",marginBottom:12}}>DOL Compliance Suite</div>

      </div>

      {/* Step indicator */}

        {["Upload","Extract","Review","Download"].map((label,i)=>(
          <React.Fragment key={label}>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:80}}>
              <div style={{width:32,height:32,borderRadius:"50%",background:i<=stepIdx?"#1B2A4A":i===stepIdx?"#C9A84C":"#e8e8e8",color:i<=stepIdx?"#fff":"#999",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,marginBottom:4,transition:"all 0.3s"}}>

                        <div style={{fontSize:10,color:"#888",marginBottom:3,fontWeight:600}}>{d}</div>
                        <input type="number" min="0" max="24" style={{...css.inp,textAlign:"center",padding:"6px 2px",fontSize:13}} value={(emp.daily_hours||[])[di]??0}
                          onChange={e=>{const h=[...(emp.daily_hours||[0,0,0,0,0,0,0])];h[di]=+e.target.value;updateField(`employees[${idx}].daily_hours`,h);}}/>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={css.g3}>
                  <Field label="ST Hours" path={`employees[${idx}].st_hours`} value={emp.st_hours}/>
                  <Field label="OT Hours" path={`employees[${idx}].ot_hours`} value={emp.ot_hours}/>
                  <Field label="ST Rate ($/hr)" path={`employees[${idx}].rate_of_pay`} value={emp.rate_of_pay}/>
                  <Field label="OT Rate ($/hr)" path={`employees[${idx}].ot_rate`} value={emp.ot_rate}/>
                  <Field label="Gross Wages ($)" path={`employees[${idx}].gross_wages`} value={emp.gross_wages}/>
                  <Field label="Net Wages ($)" path={`employees[${idx}].net_wages`} value={emp.net_wages}/>
                </div>
                <div style={css.g6}>
                  {["fica","fed_tax","state_tax","other_ded1","other_ded2","total_deductions"].map(f=>(
                    <Field key={f} label={f.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())} path={`employees[${idx}].${f}`} value={emp[f]}/>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4}}>
            <button style={css.btnOut} onClick={()=>{setStep("upload");setEditedData(null);}}>← Start Over</button>
            <button style={css.btn} onClick={handleGenerate}>Generate WH-347 PDF →</button>
          </div>
        </div>
      )}

      {/* DONE */}
      {step==="done" && (
        <div style={{...css.card,textAlign:"center",padding:"52px 28px"}} className="fade-in">
          <div style={{width:64,height:64,borderRadius:"50%",background:"#e8f5e9",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px"}}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h2 style={{fontSize:22,fontWeight:700,color:"#1B2A4A",margin:"0 0 8px"}}>WH-347 Ready</h2>
          <p style={{fontSize:14,color:"#666",margin:"0 0 28px"}}>
            Form generated for week ending <strong>{editedData?.week_ending}</strong>.<br/>
            Review carefully, obtain authorized signature, then submit.
          </p>
          <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap",marginBottom:28}}>
            <button style={css.btn} onClick={handleDownload}>⬇ Download PDF</button>
            <button style={css.btnOut} onClick={()=>setStep("review")}>Edit Data</button>
            <button style={css.btnOut} onClick={()=>{setStep("upload");setEditedData(null);setPdfBlob(null);}}>New Payroll</button>
          </div>
          <div style={{padding:"14px 20px",background:"#f8f9ff",borderRadius:8,textAlign:"left",border:"1px solid #d0d8f0"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#1B2A4A",marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>Next Steps</div>
            {["Print and verify all figures for accuracy","Have the authorized signatory sign the form","Submit to the contracting officer each week","Retain copy for at least 3 years (29 CFR Part 5)"].map((s,i)=>(
              <div key={i} style={{fontSize:12,color:"#555",display:"flex",gap:8,marginBottom:5}}>
                <span style={{fontWeight:700,color:"#1B2A4A",flexShrink:0}}>{i+1}.</span>{s}
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{textAlign:"center",marginTop:24,fontSize:11,color:"#aaa",lineHeight:1.8}}>
        Always verify generated forms before submission.<br/>
        Compliance responsibility rests with the contractor. This tool does not constitute legal advice.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
